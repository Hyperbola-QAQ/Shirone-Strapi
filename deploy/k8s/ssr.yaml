apiVersion: apps/v1
kind: Deployment
metadata:
  name: shirone-ssr
  namespace: mizuki
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  replicas: 2
  selector: {matchLabels: {app: shirone-ssr}}
  template:
    metadata:
      labels: {app: shirone-ssr, app.kubernetes.io/part-of: shirone-strapi}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ssr
          image: 192.168.86.100:30500/shirone/ssr@sha256:152e59023e5a0a7e7798c5d363a36952aac9107d1ea88ee724eabc8d8bd1f0bf
          ports: [{name: http, containerPort: 4321}]
          env:
            - {name: HOST, value: '0.0.0.0'}
            - {name: PORT, value: '4321'}
            - {name: STRAPI_URL, value: 'http://shirone-cms:1337'}
            - {name: MEILI_URL, value: 'http://shirone-search:7700'}
            - name: STRAPI_API_TOKEN
              valueFrom: {secretKeyRef: {name: shirone-ssr-reader, key: STRAPI_API_TOKEN}}
          envFrom: [{secretRef: {name: shirone-ssr-static}}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 36}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: shirone-ssr
  namespace: mizuki
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  selector: {app: shirone-ssr}
  ports: [{name: http, port: 80, targetPort: http}]

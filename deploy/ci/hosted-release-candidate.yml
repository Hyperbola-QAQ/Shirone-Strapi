# REVIEW ONLY: deliberately outside .github/workflows; do not activate.
name: Shirone-Strapi hosted release candidate
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: shirone-release-candidate
  cancel-in-progress: false
env:
  NODE_IMAGE: ghcr.io/hyperbola-qaq/shirone-base-node@sha256:4de898ca0d4e1f2169d9b846df3710f29f6787fd3131211e2e74a7898c0528cc
  POSTGRES_TEST_IMAGE: ghcr.io/hyperbola-qaq/shirone-base-postgresql@sha256:cc634644a1d502108b9282bd6e92474db4b96c4bb2480410fe24cf6cde823457
  MEILI_TEST_IMAGE: docker.m.daocloud.io/getmeili/meilisearch@sha256:cad32322d74319f2076f41828094774fbbacacff6bda32e317933293b76db616
  CMS_REPO: ghcr.io/hyperbola-qaq/shirone-cms
  SSR_REPO: ghcr.io/hyperbola-qaq/shirone-ssr
  RECONCILER_REPO: ghcr.io/hyperbola-qaq/shirone-reconciler
jobs:
  source:
    if: github.repository == 'Hyperbola-QAQ/Shirone-Strapi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate source using pinned domestic tools
        run: bash deploy/ci/hosted-validate.sh
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read, packages: write}
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/shirone-docker-config
    outputs:
      cms_digest: ${{ steps.build.outputs.cms_digest }}
      ssr_digest: ${{ steps.build.outputs.ssr_digest }}
      reconciler_digest: ${{ steps.build.outputs.reconciler_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Require current main and pre-existing private packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/ci/release-preflight.sh
      - name: Build and push private staging digests
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/ci/release-build-candidate.sh
      - name: Remove ephemeral registry credentials
        if: always()
        run: docker logout ghcr.io || true
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read, packages: read}
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/shirone-docker-config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pull and test exactly the pushed digests
        env:
          GH_TOKEN: ${{ github.token }}
          CMS_DIGEST: ${{ needs.build.outputs.cms_digest }}
          SSR_DIGEST: ${{ needs.build.outputs.ssr_digest }}
          RECONCILER_DIGEST: ${{ needs.build.outputs.reconciler_digest }}
        run: bash deploy/ci/release-test-candidate.sh
  sign:
    # A fresh runner with no checkout or project code, gated by all prior jobs.
    needs: [source, build, test]
    if: needs.source.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, packages: write, attestations: write, id-token: write}
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/shirone-docker-config
      CMS_DIGEST: ${{ needs.build.outputs.cms_digest }}
      SSR_DIGEST: ${{ needs.build.outputs.ssr_digest }}
      RECONCILER_DIGEST: ${{ needs.build.outputs.reconciler_digest }}
    steps:
      - name: Validate build outputs and authenticate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for digest in "$CMS_DIGEST" "$SSR_DIGEST" "$RECONCILER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hyperbola-qaq/shirone-cms
          subject-digest: ${{ env.CMS_DIGEST }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hyperbola-qaq/shirone-ssr
          subject-digest: ${{ env.SSR_DIGEST }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hyperbola-qaq/shirone-reconciler
          subject-digest: ${{ env.RECONCILER_DIGEST }}
          push-to-registry: true
      - name: Remove ephemeral registry credentials
        if: always()
        run: docker logout ghcr.io || true

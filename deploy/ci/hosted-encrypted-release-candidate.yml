# INACTIVE CANDIDATE: outside .github/workflows.
# Main pushes build and sign; deployment remains separately guarded.
name: Shirone encrypted release validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - deploy/k8s/**
permissions: {}
concurrency:
  group: shirone-encrypted-release
  cancel-in-progress: false
jobs:
  build_test_encrypt:
    if: github.repository == 'Hyperbola-QAQ/Shirone-Strapi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      ciphertext_digest: ${{ steps.build.outputs.ciphertext_digest }}
      metadata_digest: ${{ steps.build.outputs.metadata_digest }}
    env:
      SHIRONE_CI_DISPOSABLE: 'yes'
      SHIRONE_OCI_BASE_CONTEXT: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require exact current main and reviewed recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api repos/Hyperbola-QAQ/Shirone-Strapi/git/ref/heads/main --jq .object.sha)" == "$GITHUB_SHA" ]]
          [[ -f deploy/ci/release-recipient.txt && ! -L deploy/ci/release-recipient.txt ]]
          recipient=$(cat deploy/ci/release-recipient.txt)
          [[ "$recipient" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
          [[ "$(wc -l < deploy/ci/release-recipient.txt)" -eq 1 ]]
      - name: Check disposable runner disk headroom
        run: |
          set -euo pipefail
          available_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          [[ "$available_kib" =~ ^[0-9]+$ && "$available_kib" -ge 10485760 ]] || {
            echo 'Less than 10 GiB is available on the disposable runner.' >&2; exit 1;
          }
      - name: Install checksum-pinned tools
        run: |
          set -euo pipefail
          node_bin=$(bash deploy/ci/install-node-pnpm-candidate.sh "$RUNNER_TEMP/shirone-node")
          age_bin=$(bash deploy/ci/install-age-candidate.sh "$RUNNER_TEMP/shirone-age")
          mkdir -m 700 "$RUNNER_TEMP/shirone-age-bin"
          ln -s "$age_bin" "$RUNNER_TEMP/shirone-age-bin/age"
          printf '%s\n%s\n' "$node_bin" "$RUNNER_TEMP/shirone-age-bin" >> "$GITHUB_PATH"
      - name: Enable OCI image store on the disposable runner
        run: bash deploy/ci/setup-hosted-docker-store-candidate.sh
      - name: Prepare a digest-pinned OCI builder
        run: bash deploy/ci/setup-oci-builder-candidate.sh "shirone-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Build, test exact OCI images, and encrypt
        id: build
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/shirone-release"
          recipient=$(cat deploy/ci/release-recipient.txt)
          if ! bash deploy/ci/build-encrypted-release-candidate.sh "$GITHUB_SHA" "$recipient" "$RUNNER_TEMP/shirone-release/release.age" > "$RUNNER_TEMP/shirone-release/metadata.json" 2> "$RUNNER_TEMP/shirone-build-private.log"; then
            echo 'Build, integration or encryption failed; private logs are not uploaded.' >&2
            python3 deploy/ci/report-ci-failure.py "$RUNNER_TEMP/shirone-build-private.log" >&2
            exit 1
          fi
          digest=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["schema"]==1 and d["source_commit"]==sys.argv[2]; print(d["ciphertext_digest"])' "$RUNNER_TEMP/shirone-release/metadata.json" "$GITHUB_SHA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "sha256:$(sha256sum "$RUNNER_TEMP/shirone-release/release.age" | cut -d' ' -f1)" == "$digest" ]]
          metadata_digest="sha256:$(sha256sum "$RUNNER_TEMP/shirone-release/metadata.json" | cut -d' ' -f1)"
          printf 'ciphertext_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'metadata_digest=%s\n' "$metadata_digest" >> "$GITHUB_OUTPUT"
      - name: Upload only encrypted release
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shirone-encrypted-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shirone-release/release.age
            ${{ runner.temp }}/shirone-release/metadata.json
          if-no-files-found: error
          retention-days: 1
  sign:
    needs: build_test_encrypt
    if: needs.build_test_encrypt.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      ARTIFACT_ID: ${{ needs.build_test_encrypt.outputs.artifact_id }}
      CIPHERTEXT_DIGEST: ${{ needs.build_test_encrypt.outputs.ciphertext_digest }}
      METADATA_DIGEST: ${{ needs.build_test_encrypt.outputs.metadata_digest }}
    steps:
      - name: Validate expected artifact identity
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$CIPHERTEXT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$METADATA_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: ${{ runner.temp }}/shirone-sign
          merge-multiple: true
      - name: Check exact ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(find "$RUNNER_TEMP/shirone-sign" -type f | wc -l)" -eq 2 ]]
          [[ -f "$RUNNER_TEMP/shirone-sign/release.age" && ! -L "$RUNNER_TEMP/shirone-sign/release.age" ]]
          [[ -f "$RUNNER_TEMP/shirone-sign/metadata.json" && ! -L "$RUNNER_TEMP/shirone-sign/metadata.json" ]]
          [[ "sha256:$(sha256sum "$RUNNER_TEMP/shirone-sign/release.age" | cut -d' ' -f1)" == "$CIPHERTEXT_DIGEST" ]]
          [[ "sha256:$(sha256sum "$RUNNER_TEMP/shirone-sign/metadata.json" | cut -d' ' -f1)" == "$METADATA_DIGEST" ]]
          gh api "repos/Hyperbola-QAQ/Shirone-Strapi/contents/deploy/ci/release-recipient.txt?ref=$GITHUB_SHA" > "$RUNNER_TEMP/shirone-recipient-api.json"
          python3 - "$RUNNER_TEMP/shirone-sign/metadata.json" "$RUNNER_TEMP/shirone-recipient-api.json" <<'PY'
          import base64, hashlib, json, os, re, sys
          def unique(pairs):
              result = {}
              for k, v in pairs:
                  if k in result: raise ValueError('duplicate metadata field')
                  result[k] = v
              return result
          with open(sys.argv[1], 'rb') as f:
              raw = f.read(16385)
          if not 0 < len(raw) <= 16384: raise ValueError('invalid metadata size')
          meta = json.loads(raw, object_pairs_hook=unique)
          with open(sys.argv[2], 'rb') as f: item = json.load(f)
          if item.get('type') != 'file' or item.get('encoding') != 'base64' or not 0 < item.get('size', 0) <= 128:
              raise ValueError('invalid recipient source')
          key_bytes = base64.b64decode(''.join(item['content'].split()), validate=True)
          if len(key_bytes) != item['size'] or not key_bytes.endswith(b'\n') or key_bytes.count(b'\n') != 1:
              raise ValueError('invalid recipient file')
          key = key_bytes[:-1].decode('ascii')
          if not re.fullmatch(r'age1[023456789acdefghjklmnpqrstuvwxyz]{58}', key): raise ValueError('invalid recipient')
          expected = {'schema','source_commit','recipient_fingerprint','ciphertext_digest','manifests'}
          if not isinstance(meta, dict) or set(meta) != expected or type(meta['schema']) is not int or meta['schema'] != 1:
              raise ValueError('invalid metadata schema')
          if meta['source_commit'] != os.environ['GITHUB_SHA'] or meta['ciphertext_digest'] != os.environ['CIPHERTEXT_DIGEST']:
              raise ValueError('wrong source or ciphertext')
          if meta['recipient_fingerprint'] != 'sha256:' + hashlib.sha256(key.encode('ascii')).hexdigest():
              raise ValueError('wrong recipient')
          images = meta['manifests']
          if not isinstance(images, dict) or set(images) != {'cms','ssr','reconciler'} or not all(isinstance(v,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',v) for v in images.values()):
              raise ValueError('invalid image identities')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/shirone-sign/release.age
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/shirone-sign/metadata.json
          create-storage-record: false

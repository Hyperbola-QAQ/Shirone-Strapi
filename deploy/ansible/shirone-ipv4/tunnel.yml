---
# Inventory must define aliases txy and imini with host-key checking enabled.
# Preview is read-only; apply only after reviewing the complete edge route.
- name: Inspect the reviewed edge host and capture its verified host key
  hosts: txy
  gather_facts: false
  vars:
    tunnel_apply: false
    tunnel_origin_host: ''
    tunnel_gateway_service: shirone-ipv4-gateway
    tunnel_gateway_uid: ''
    tunnel_gateway_selector: {app: shirone-ipv4-higress}
    tunnel_gateway_verified: false
  tasks:
    - name: Read the host name
      ansible.builtin.command: hostname
      register: txy_name
      changed_when: false
      check_mode: false
    - name: Require the intended host and explicit mode
      ansible.builtin.assert:
        that:
          - txy_name.stdout | lower == 'hyqaq-txy'
          - (ansible_ssh_common_args | default('')) is not search('StrictHostKeyChecking=no')
          - not (tunnel_apply | bool and ansible_check_mode)
          - not (tunnel_apply | bool) or (tunnel_gateway_verified | bool)
          - not (tunnel_apply | bool) or tunnel_gateway_service == 'shirone-ipv4-gateway'
          - not (tunnel_apply | bool) or (tunnel_gateway_uid is match('^[a-f0-9-]{36}$'))
          - not (tunnel_apply | bool) or (tunnel_origin_host is match('^10\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$'))
          - "not (tunnel_apply | bool) or tunnel_gateway_selector == {'app': 'shirone-ipv4-higress'}"
        quiet: true
    - name: Read the already SSH-verified edge host public key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: edge_host_key
      check_mode: false
    - name: Inspect the tunnel identity
      ansible.builtin.command: getent passwd shirone-tunnel
      register: existing_account
      failed_when: existing_account.rc not in [0, 2]
      changed_when: false
      check_mode: false
    - name: Inspect our owned configuration marker
      ansible.builtin.stat:
        path: /etc/ssh/shirone-ipv4/owner
      register: owner_marker
    - name: Refuse to adopt an unrelated account
      ansible.builtin.assert:
        that:
          - existing_account.rc != 0 or owner_marker.stat.exists
        quiet: true
    - name: Read an existing ownership marker
      ansible.builtin.slurp:
        src: /etc/ssh/shirone-ipv4/owner
      register: existing_owner
      when: owner_marker.stat.exists
    - name: Refuse a mismatching ownership marker
      ansible.builtin.assert:
        that: [(existing_owner.content | b64decode | trim) == 'shirone-ipv4-tunnel-v1']
        quiet: true
      when: owner_marker.stat.exists
    - name: Check reverse listener availability on first install
      ansible.builtin.shell: "! ss -H -lnt '( sport = :25443 )' | grep -q ."
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false
      when: not owner_marker.stat.exists

- name: Prepare the originating host's restricted private key
  hosts: imini
  gather_facts: false
  vars:
    tunnel_apply: false
    tunnel_key_dir: /home/hyperbola/.local/share/shirone-ipv4-tunnel
    tunnel_origin_host: ''
    tunnel_gateway_service: shirone-ipv4-gateway
    tunnel_gateway_uid: ''
    tunnel_gateway_selector: {app: shirone-ipv4-higress}
  tasks:
    - name: Check origin identity
      ansible.builtin.command: hostname
      register: origin_name
      changed_when: false
      check_mode: false
    - name: Require intended origin
      ansible.builtin.assert:
        that: [origin_name.stdout | lower == 'hyqaq-imini']
        quiet: true
    - name: Require an IPv4 address in the cluster Service CIDR
      ansible.builtin.command:
        argv: [python3, -c, "import ipaddress,sys; sys.exit(0 if ipaddress.ip_address(sys.argv[1]) in ipaddress.ip_network('10.96.0.0/12') else 1)", '{{ tunnel_origin_host }}']
      changed_when: false
      when: tunnel_apply | bool
    - name: Read the reviewed dedicated gateway Service without secrets
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /home/hyperbola/.kube/config, -n, higress-system, get, service, '{{ tunnel_gateway_service }}', -o, json]
      register: dedicated_service_raw
      changed_when: false
      when: tunnel_apply | bool
    - name: Require the reviewed Service identity, address, selector and HTTPS port
      ansible.builtin.assert:
        that:
          - (dedicated_service_raw.stdout | from_json).metadata.uid == tunnel_gateway_uid
          - (dedicated_service_raw.stdout | from_json).spec.type == 'ClusterIP'
          - (dedicated_service_raw.stdout | from_json).spec.clusterIP == tunnel_origin_host
          - (dedicated_service_raw.stdout | from_json).spec.selector == tunnel_gateway_selector
          - ((dedicated_service_raw.stdout | from_json).spec.ports | selectattr('port', 'equalto', 8443) | list | length) == 1
        quiet: true
      when: tunnel_apply | bool
    - name: Inspect the origin state directory
      ansible.builtin.stat:
        path: '{{ tunnel_key_dir }}'
      register: origin_dir
    - name: Inspect the origin ownership marker
      ansible.builtin.stat:
        path: '{{ tunnel_key_dir }}/owner'
      register: origin_owner
    - name: Inspect the candidate service file
      ansible.builtin.stat:
        path: /home/hyperbola/.config/systemd/user/shirone-ipv4-tunnel.service
      register: origin_service
    - name: Refuse to adopt unrelated state or service
      ansible.builtin.assert:
        that:
          - not origin_dir.stat.exists or origin_owner.stat.exists
          - not origin_service.stat.exists or origin_owner.stat.exists
        quiet: true
    - name: Verify existing origin ownership
      ansible.builtin.slurp:
        src: '{{ tunnel_key_dir }}/owner'
      register: origin_owner_data
      when: origin_owner.stat.exists
    - name: Refuse a mismatching origin marker
      ansible.builtin.assert:
        that: [(origin_owner_data.content | b64decode | trim) == 'shirone-ipv4-tunnel-v1']
        quiet: true
      when: origin_owner.stat.exists
    - name: Create private state directory
      ansible.builtin.file:
        path: '{{ tunnel_key_dir }}'
        state: directory
        mode: '0700'
      when: tunnel_apply | bool
    - name: Generate or verify the dedicated SSH identity
      community.crypto.openssh_keypair:
        path: '{{ tunnel_key_dir }}/id_ed25519'
        type: ed25519
        mode: '0600'
        regenerate: never
      register: tunnel_identity
      no_log: true
      when: tunnel_apply | bool
    - name: Record origin ownership
      ansible.builtin.copy:
        dest: '{{ tunnel_key_dir }}/owner'
        content: "shirone-ipv4-tunnel-v1\n"
        mode: '0600'
      when: tunnel_apply | bool
    - name: Pin the host key obtained over verified controller SSH
      ansible.builtin.copy:
        dest: '{{ tunnel_key_dir }}/known_hosts'
        mode: '0600'
        content: "txy.hyperbola.cc {{ (hostvars['txy'].edge_host_key.content | b64decode).split()[0:2] | join(' ') }}\n"
      when: tunnel_apply | bool

- name: Restrict the dedicated account on the existing edge SSH listener
  hosts: txy
  gather_facts: false
  become: true
  vars:
    tunnel_apply: false
  tasks:
    - name: Read effective configuration for the existing operator
      ansible.builtin.command: /usr/sbin/sshd -T -C user=hyperbola,host=localhost,addr=127.0.0.1
      register: before_operator
      changed_when: false
      check_mode: false
    - name: Create the dedicated system identity
      ansible.builtin.user:
        name: shirone-tunnel
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      when: tunnel_apply | bool
    - name: Create root-owned key directory
      ansible.builtin.file:
        path: /etc/ssh/shirone-ipv4
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: tunnel_apply | bool
    - name: Install the exact restricted key
      ansible.builtin.copy:
        dest: /etc/ssh/shirone-ipv4/authorized_keys
        owner: root
        group: root
        mode: '0644'
        content: "restrict,port-forwarding,permitlisten=\"127.0.0.1:25443\" {{ hostvars['imini'].tunnel_identity.public_key }}\n"
      no_log: true
      when: tunnel_apply | bool
    - name: Stage and verify the scoped Match configuration
      when: tunnel_apply | bool
      block:
        - name: Append a scoped Match block and validate SSH configuration
          ansible.builtin.blockinfile:
            path: /etc/ssh/sshd_config
            marker: '# {mark} SHIRONE IPV4 TUNNEL (managed by Ansible)'
            block: |
              Match User shirone-tunnel
                  AuthorizedKeysFile /etc/ssh/shirone-ipv4/authorized_keys
                  AllowTcpForwarding remote
                  PermitListen 127.0.0.1:25443
                  ForceCommand /bin/false
                  PermitTTY no
                  X11Forwarding no
                  AllowAgentForwarding no
                  PermitUserRC no
                  GatewayPorts no
            validate: /usr/sbin/sshd -t -f %s
          register: tunnel_match
        - name: Verify the existing operator effective configuration is unchanged
          ansible.builtin.command: /usr/sbin/sshd -T -C user=hyperbola,host=localhost,addr=127.0.0.1
          register: after_operator
          changed_when: false
          check_mode: false
        - name: Refuse a configuration which changes the existing operator
          ansible.builtin.assert:
            that: [before_operator.stdout == after_operator.stdout]
            quiet: true
        - name: Read the dedicated account's effective SSH policy
          ansible.builtin.command: /usr/sbin/sshd -T -C user=shirone-tunnel,host=localhost,addr=127.0.0.1
          register: tunnel_policy
          changed_when: false
          check_mode: false
        - name: Require the constrained forwarding policy
          ansible.builtin.assert:
            that:
              - "'allowtcpforwarding remote' in tunnel_policy.stdout_lines"
              - "'permitlisten 127.0.0.1:25443' in tunnel_policy.stdout_lines"
              - "'forcecommand /bin/false' in tunnel_policy.stdout_lines"
              - "'permittty no' in tunnel_policy.stdout_lines"
              - "'allowagentforwarding no' in tunnel_policy.stdout_lines"
              - "'authorizedkeysfile /etc/ssh/shirone-ipv4/authorized_keys' in tunnel_policy.stdout_lines"
            quiet: true
        - name: Reload SSH only after validation
          ansible.builtin.systemd:
            name: ssh.service
            state: reloaded
          when: tunnel_match.changed
      rescue:
        - name: Remove a newly installed Match block after validation failure
          ansible.builtin.blockinfile:
            path: /etc/ssh/sshd_config
            marker: '# {mark} SHIRONE IPV4 TUNNEL (managed by Ansible)'
            state: absent
            validate: /usr/sbin/sshd -t -f %s
          when: not hostvars['txy'].owner_marker.stat.exists
        - name: Stop for manual reconciliation
          ansible.builtin.fail:
            msg: 'SSH configuration validation failed; inspect staged identity and configuration before retrying.'
    - name: Record ownership after successful configuration
      ansible.builtin.copy:
        dest: /etc/ssh/shirone-ipv4/owner
        content: "shirone-ipv4-tunnel-v1\n"
        owner: root
        group: root
        mode: '0644'
      when: tunnel_apply | bool

- name: Start the single originating SSH reverse connection
  hosts: imini
  gather_facts: false
  vars:
    tunnel_apply: false
    tunnel_key_dir: /home/hyperbola/.local/share/shirone-ipv4-tunnel
    tunnel_origin_host: ''
  tasks:
    - name: Install user unit
      ansible.builtin.copy:
        dest: /home/hyperbola/.config/systemd/user/shirone-ipv4-tunnel.service
        mode: '0644'
        content: |
          [Unit]
          Description=Shirone IPv4 ingress reverse SSH connection
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/ssh -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ tunnel_key_dir }}/known_hosts -o GlobalKnownHostsFile=/dev/null -o PasswordAuthentication=no -o IdentitiesOnly=yes -i {{ tunnel_key_dir }}/id_ed25519 -R 127.0.0.1:25443:{{ tunnel_origin_host }}:8443 shirone-tunnel@txy.hyperbola.cc
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=default.target
      when: tunnel_apply | bool
      register: unit
    - name: Enable tunnel
      ansible.builtin.systemd:
        scope: user
        name: shirone-ipv4-tunnel.service
        daemon_reload: true
        enabled: true
        state: '{{ "restarted" if unit.changed else "started" }}'
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
      when: tunnel_apply | bool

- name: Verify the origin through the edge loopback tunnel
  hosts: txy
  gather_facts: false
  vars:
    tunnel_apply: false
  tasks:
    - name: Verify PROXY v2, TLS SNI and certificate for both public entrypoints
      ansible.builtin.command:
        argv: [python3, '-', '{{ item.host }}', '{{ item.path }}']
        stdin: "{{ lookup('file', 'tunnel-probe.py') }}"
      loop:
        - {host: hyperbola.cc, path: /}
        - {host: strapi.hyperbola.cc, path: /admin}
      register: tunnel_probe
      until: tunnel_probe.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      when: tunnel_apply | bool

apiVersion: v1
kind: Service
metadata:
  name: shirone-ipv4-gateway
  namespace: higress-system
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  type: ClusterIP
  selector: {app: shirone-ipv4-higress}
  ports:
    - {name: https, protocol: TCP, port: 8443, targetPort: 8443}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shirone-ipv4
  namespace: higress-system
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  gatewayClassName: higress
  addresses:
    - {type: Hostname, value: shirone-ipv4-gateway.higress-system.svc.cluster.local}
  listeners:
    - name: apex
      hostname: hyperbola.cc
      port: 8443
      protocol: HTTPS
      tls: {mode: Terminate, certificateRefs: [{name: hyperbola-cc-tls}]}
      allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {kubernetes.io/metadata.name: mizuki}}}, kinds: [{kind: HTTPRoute}]}
    - name: www
      hostname: www.hyperbola.cc
      port: 8443
      protocol: HTTPS
      tls: {mode: Terminate, certificateRefs: [{name: hyperbola-cc-tls}]}
      allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {kubernetes.io/metadata.name: mizuki}}}, kinds: [{kind: HTTPRoute}]}
    - name: blog
      hostname: blog.hyperbola.cc
      port: 8443
      protocol: HTTPS
      tls: {mode: Terminate, certificateRefs: [{name: hyperbola-cc-tls}]}
      allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {kubernetes.io/metadata.name: mizuki}}}, kinds: [{kind: HTTPRoute}]}
    - name: admin
      hostname: strapi.hyperbola.cc
      port: 8443
      protocol: HTTPS
      tls: {mode: Terminate, certificateRefs: [{name: hyperbola-cc-tls}]}
      allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {kubernetes.io/metadata.name: mizuki}}}, kinds: [{kind: HTTPRoute}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shirone-ipv4-site
  namespace: mizuki
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  parentRefs:
    - {name: shirone-ipv4, namespace: higress-system, sectionName: apex}
    - {name: shirone-ipv4, namespace: higress-system, sectionName: www}
    - {name: shirone-ipv4, namespace: higress-system, sectionName: blog}
  hostnames: [hyperbola.cc, www.hyperbola.cc, blog.hyperbola.cc]
  rules:
    - backendRefs: [{name: mizuki, port: 80}]

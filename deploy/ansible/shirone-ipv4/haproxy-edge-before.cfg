global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend edge_http
    bind 0.0.0.0:80
    default_backend traefik_http

backend traefik_http
    server local_traefik 10.0.0.30:30486 send-proxy-v2 check

frontend edge_https
    bind 0.0.0.0:443
    default_backend traefik_https

backend traefik_https
    server local_traefik 10.0.0.30:31908 send-proxy-v2 check

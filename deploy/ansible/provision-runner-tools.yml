---
# Prepare isolated tools and the minimal Ansible source copy. Disabled by default.
- name: Prepare Shirone runner tools and Ansible source
  hosts: hyqaq-imini
  gather_facts: false
  become: true
  vars:
    shirone_runner_tools_apply: false
    shirone_runner_share: /home/github-actions/.local/share/shirone-release
    shirone_runner_ops_source: /home/hyperbola/Work/ansible-debian-k8s
  tasks:
    - name: Report disabled default
      ansible.builtin.debug:
        msg: Runner tools provisioning is disabled; no changes requested.
      when: not shirone_runner_tools_apply | bool

    - name: Prepare private runner environment
      when: shirone_runner_tools_apply | bool
      become_user: github-actions
      block:
        - name: Require reviewed target and paths
          ansible.builtin.assert:
            that:
              - inventory_hostname == 'hyqaq-imini'
              - shirone_runner_share == '/home/github-actions/.local/share/shirone-release'
              - shirone_runner_ops_source == '/home/hyperbola/Work/ansible-debian-k8s'
              - lookup('env', 'SHIRONE_WORKSPACE') == '/home/hyperbola/.codex/worktrees/shirone-strapi/Mizuki'
              - (lookup('file', lookup('env', 'SHIRONE_WORKSPACE') + '/deploy/ci/install-controller-tools.py', rstrip=False) | hash('sha256')) == 'c61d76efaa2b7012e88a327790bc8e5d5d06ca9679cf82ac7adae82cc533467f'

        - name: Create only a new private runner directory
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import os, stat
                flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
                fd = os.open('/home/github-actions', flags)
                try:
                    for part in ('.local', 'share'):
                        try: os.mkdir(part, 0o700, dir_fd=fd)
                        except FileExistsError: pass
                        nxt = os.open(part, flags, dir_fd=fd)
                        info = os.fstat(nxt)
                        if info.st_uid != os.getuid() or info.st_mode & 0o022:
                            os.close(nxt)
                            raise ValueError('unsafe ancestor')
                        os.close(fd)
                        fd = nxt
                    try: os.mkdir('shirone-release', 0o700, dir_fd=fd)
                    except FileExistsError: pass
                    child = os.open('shirone-release', flags, dir_fd=fd)
                    try:
                        info = os.fstat(child)
                        if info.st_uid != os.getuid() or info.st_mode & 0o077:
                            raise ValueError('unsafe release directory')
                        try: os.stat('tools', dir_fd=child, follow_symlinks=False)
                        except FileNotFoundError: pass
                        else: raise ValueError('tools already exist; review before retry')
                    finally: os.close(child)
                finally: os.close(fd)

        - name: Install pinned user-space installer as runner
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import hashlib, os, sys
                data = sys.stdin.buffer.read()
                if hashlib.sha256(data).hexdigest() != 'c61d76efaa2b7012e88a327790bc8e5d5d06ca9679cf82ac7adae82cc533467f':
                    raise ValueError('installer checksum mismatch')
                directory = os.open('/home/github-actions/.local/share/shirone-release', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                try:
                    try: fd = os.open('install-controller-tools.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o700, dir_fd=directory)
                    except FileExistsError: pass
                    else:
                        with os.fdopen(fd, 'wb') as output: output.write(data)
                finally: os.close(directory)
            stdin: "{{ lookup('file', lookup('env', 'SHIRONE_WORKSPACE') + '/deploy/ci/install-controller-tools.py', rstrip=False) }}"
            stdin_add_newline: false

        - name: Inspect copied installer without following links
          ansible.builtin.stat:
            path: "{{ shirone_runner_share }}/install-controller-tools.py"
            follow: false
            checksum_algorithm: sha256
          register: shirone_tools_installer

        - name: Require exact runner-owned installer
          ansible.builtin.assert:
            that:
              - shirone_tools_installer.stat.isreg | default(false)
              - not (shirone_tools_installer.stat.islnk | default(false))
              - shirone_tools_installer.stat.pw_name == 'github-actions'
              - shirone_tools_installer.stat.mode == '0700'
              - shirone_tools_installer.stat.checksum == 'c61d76efaa2b7012e88a327790bc8e5d5d06ca9679cf82ac7adae82cc533467f'

        - name: Install pinned tools without credentials
          ansible.builtin.command:
            argv: [/usr/bin/python3, "{{ shirone_runner_share }}/install-controller-tools.py", --install, --destination, "{{ shirone_runner_share }}/tools"]
          become_user: github-actions

